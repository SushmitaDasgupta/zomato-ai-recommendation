[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-ai-recommendation"
version = "0.1.0"
description = "Hybrid filter + LLM restaurant recommendation system (Zomato-inspired)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=2.16.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
]

[project.scripts]
zomato-ingest = "src.data.ingest:main"
zomato-profile = "src.data.profile:main"
zomato-demo = "src.demo:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
