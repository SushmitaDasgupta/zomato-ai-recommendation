# Railway Phase 1 — FastAPI from repo root (not frontend/).
# https://docs.railway.com/guides/config-as-code

[build]
builder = "NIXPACKS"
watchPatterns = [
  "src/**",
  "data/processed/**",
  "pyproject.toml",
  "requirements.txt",
  "scripts/start-api.sh",
  "railway.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "PATH=/opt/venv/bin:$PATH PYTHONPATH=/app python -m src.app.run"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Public domain: leave Target Port empty so Railway uses $PORT (do not pin 8000).
