# Railway Phase 1 — FastAPI from repo root (not frontend/).
# https://docs.railway.com/guides/config-as-code

[build]
builder = "NIXPACKS"
watchPatterns = [
  "src/**",
  "pyproject.toml",
  "requirements.txt",
  "scripts/start-api.sh",
  "railway.toml",
  "nixpacks.toml",
]

[deploy]
startCommand = "bash scripts/start-api.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
